<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ODYSSEY — Corporate World Map 360°</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(18, 26, 43, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #06b6d4;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            background-image: radial-gradient(circle at 50% 10%, rgba(6, 182, 212, 0.1) 0%, transparent 40%);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .logo { display: flex; align-items: center; gap: 0.75rem; }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
        }

        .logo-title { font-size: 1.3rem; font-weight: 700; }
        .logo-subtitle { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }

        .layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.5rem;
            flex: 1;
        }

        .map-wrapper {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            min-height: 500px;
        }

        #map { width: 100%; height: 100%; min-height: 500px; }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            backdrop-filter: blur(12px);
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-label { color: var(--text-muted); }
        .info-val { font-weight: 600; text-align: right; }

        .badge {
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(6, 182, 212, 0.15);
            color: #67e8f9;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <div class="logo-icon">🌍</div>
            <div>
                <div class="logo-title">ODYSSEY</div>
                <div class="logo-subtitle">Carte du Monde Corporate & Implantations Globale</div>
            </div>
        </div>
        <div class="badge">GLOBAL WORLD MAP ONLINE</div>
    </header>

    <div class="layout">
        <div class="map-wrapper">
            <div id="map"></div>
        </div>

        <div class="card">
            <div class="card-title">Inventaire des Sites Mondiaux</div>
            <div class="info-row"><span class="info-label">Entreprise</span><span class="info-val" id="oName">-</span></div>
            <div class="info-row"><span class="info-label">Nombre Total de Sites</span><span class="info-val" id="oTotal" style="color:#67e8f9;">-</span></div>
            <div class="info-row"><span class="info-label">Pays d'Implantation</span><span class="info-val" id="oCountries">-</span></div>
        </div>
    </div>

    <script>
        let map = L.map('map').setView([20.0, 0.0], 2);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: 'Odyssey World Map Engine'
        }).addTo(map);

        async function chargerCarteMondiale() {
            try {
                const response = await fetch('/api/v1/map?siren=383474814');
                const contract = await response.json();
                const r = contract.result;

                document.getElementById('oName').textContent = r.company_name || 'Airbus SE';
                document.getElementById('oTotal').textContent = `${r.total_global_sites} Sites`;
                document.getElementById('oCountries').textContent = `${r.countries_count} Pays`;

                (r.sites || []).forEach(s => {
                    const marker = L.circleMarker([s.lat, s.lon], {
                        radius: 8, fillColor: '#06b6d4', color: '#ffffff', weight: 1.5, fillOpacity: 0.85
                    }).addTo(map);

                    marker.bindPopup(`<strong>${s.name}</strong><br/>Type: ${s.type}<br/>Pays: ${s.pays}`);
                });

            } catch (err) {
                console.error("Erreur lors du chargement d'Odyssey World Map.");
            }
        }

        window.onload = chargerCarteMondiale;
    </script>
</body>
</html>
